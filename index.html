<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTTY BRC-20 SLOT MACHINE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="slot-machine">
    <h1>BTTY BRC-20 SLOT MACHINE</h1>

    <div class="scoreboard">
        <div>Credits: <span id="credits">5000</span></div>
        <div>Bet: <span id="bet">100</span></div>
        <div>Lines: <span id="lines">5</span></div>
        <div>Win: <span id="win">0</span></div>
        <div style="color: gold; font-weight: bold;">
            JACKPOT: <span id="jackpot">500</span>
        </div>
    </div>

    <div class="reels" id="reels"></div>

    <!-- Bijgewerkte button sectie -->
    <div style="margin: 25px 0; display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap;">
        <button id="spinBtn">SPIN</button>
        <button id="linesBtn">LINES: <strong>5</strong></button>
        
        <!-- Altijd zichtbare kleine gamble knoppen -->
        <button id="kopGambleBtn" class="gamble-btn">KOP</button>
        <button id="muntGambleBtn" class="gamble-btn">MUNT</button>
    </div>

    <div id="message"></div>
</div>

<script src="game.js"></script>
</body>
</html>
