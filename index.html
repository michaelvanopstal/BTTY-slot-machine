<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTTY Slot Machine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="slot-machine">
    <h1>BTTY BRC-20 SLOT MACHINE</h1>

    <div class="scoreboard">
        <div>Credits: <span id="credits">5000</span></div>
        <div>Bet: <span id="bet">100</span></div>
        <div>Lines: <span id="lines">5</span></div>
        <div>Win: <span id="win">0</span></div>
    </div>

    <div class="reels" id="reels"></div>

    <div style="margin: 20px 0;">
        <button id="spinBtn" style="padding: 16px 70px;">SPIN</button>
        <button id="linesBtn" style="margin-left: 15px; padding: 16px 35px; font-size: 22px;">
            LINES: <strong>5</strong>
        </button>
    </div>

    <div id="message"></div>
</div>

<script src="game.js"></script>
</body>
</html>
